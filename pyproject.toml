[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "notebooklm-skill"
version = "1.4.0"
description = "NotebookLM research automation — CLI, MCP server, and Claude Code Skill"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Claude World", email = "hello@claude-world.com"}]
keywords = ["notebooklm", "mcp", "claude", "research", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "notebooklm-py[browser]>=0.8.5,<0.9",
    "fastmcp>=4.1,<5",
    "python-dotenv>=1.1,<2",
    "httpx>=0.28,<1",
    "feedparser>=6.0.12,<7",
]

[project.optional-dependencies]
dev = [
    "build>=1.3,<2",
    "mypy>=2.4,<3",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "pyyaml>=6.0.3,<7",
    "ruff>=0.17.1,<0.18",
    "twine>=7,<8",
]

[project.urls]
Homepage = "https://github.com/claude-world/notebooklm-skill"
Repository = "https://github.com/claude-world/notebooklm-skill"
Issues = "https://github.com/claude-world/notebooklm-skill/issues"

[project.scripts]
notebooklm-skill    = "scripts.notebooklm_client:main"
notebooklm-pipeline = "scripts.pipeline:main"
notebooklm-mcp      = "mcp_server.server:main"
notebooklm-auth     = "scripts.auth_helper:main"
notebooklm-install-skill = "scripts.skill_installer:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["scripts", "mcp_server"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "mcp_server*"]

[tool.setuptools.data-files]
"share/notebooklm-skill" = ["SKILL.md"]
"share/notebooklm-skill/references" = ["references/*.md"]
