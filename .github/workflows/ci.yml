name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Type check
        run: mypy scripts mcp_server

      - name: Test with coverage
        run: pytest -q --cov --cov-report=term-missing

      - name: Verify all entry points
        run: |
          notebooklm-skill --help >/dev/null
          notebooklm-pipeline --help >/dev/null
          notebooklm-mcp --help >/dev/null
          notebooklm-auth --help >/dev/null
          notebooklm-install-skill --help >/dev/null

      - name: Validate shell scripts
        run: bash -n install.sh scripts/make_video.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Verify wheel in a clean environment
        run: |
          python -m venv /tmp/notebooklm-wheel-test
          /tmp/notebooklm-wheel-test/bin/pip install dist/*.whl
          /tmp/notebooklm-wheel-test/bin/notebooklm-skill --version
          /tmp/notebooklm-wheel-test/bin/notebooklm-pipeline --version
          /tmp/notebooklm-wheel-test/bin/notebooklm-mcp --help >/dev/null
          /tmp/notebooklm-wheel-test/bin/notebooklm-auth --help >/dev/null
          /tmp/notebooklm-wheel-test/bin/notebooklm-install-skill --dry-run --target /tmp/nlm-skill-install

      - name: Verify the authentication error contract without a session
        run: |
          set +e
          NOTEBOOKLM_HOME="$(mktemp -d)" /tmp/notebooklm-wheel-test/bin/notebooklm-skill list > /tmp/nlm-auth.json
          code=$?
          set -e
          cat /tmp/nlm-auth.json
          test "$code" -eq 4
          grep -q '"code": "AUTH_REQUIRED"' /tmp/nlm-auth.json

      - name: Smoke-test the MCP server over stdio
        run: |
          /tmp/notebooklm-wheel-test/bin/python - <<'PY'
          import asyncio

          from fastmcp import Client
          from fastmcp.client.transports import StdioTransport


          async def main() -> None:
              transport = StdioTransport(command="/tmp/notebooklm-wheel-test/bin/notebooklm-mcp", args=[])
              async with Client(transport) as client:
                  names = sorted(tool.name for tool in await client.list_tools())
              assert len(names) == 13, names
              print("MCP stdio tools:", ", ".join(names))


          asyncio.run(main())
          PY

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Validate configuration and documentation contract
        run: |
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          json.loads(pathlib.Path('.mcp.json').read_text())
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          assert project['version']
          assert len(project['scripts']) == 5

          roots = [
              pathlib.Path('README.md'), pathlib.Path('README.zh-TW.md'),
              pathlib.Path('SKILL.md'), pathlib.Path('AGENTS.md'),
              pathlib.Path('docs'), pathlib.Path('examples'), pathlib.Path('references'),
          ]
          files = []
          for root in roots:
              files.extend(root.rglob('*.md') if root.is_dir() else [root])
          stale = {
              'notebooklm-py v0.3.4', 'uvx notebooklm login', 'threads_api.py',
              'generate audio --notebook', 'research-poll', 'mcp-server/', '0.7.x',
          }
          hits = [(str(path), token) for path in files for token in stale if token in path.read_text()]
          assert not hits, f'stale documentation references: {hits}'
          print(f'validated {len(files)} documentation files')
          PY
